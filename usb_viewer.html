<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 USB Camera</title>
<link rel="stylesheet" href="ui.css">
<style>
  #status{font-size:13px;white-space:normal;max-width:100%;border-radius:10px}
  #board{color:#8fd19e;line-height:1.6;font-size:13px}
  .settings-grid{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-end}
  .grp{display:flex;gap:8px;align-items:flex-end}
  .grp input[type=number]{width:90px}
  .grp input[type=text],.grp input[type=password]{width:150px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>
<script>
(function () {
  function killBadge() {
    try {
      var el = document.getElementById('nl-badge-frame');
      if (el && el.parentNode) el.parentNode.removeChild(el);
      var ifs = document.querySelectorAll('iframe[src*="/.netlify/"], iframe[src*="netlify"]');
      for (var i = 0; i < ifs.length; i++) {
        if (ifs[i].id === 'nl-badge-frame' || /\.netlify\//.test(ifs[i].src)) {
          if (ifs[i].parentNode) ifs[i].parentNode.removeChild(ifs[i]);
        }
      }
    } catch (e) {}
  }
  killBadge();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', killBadge);
  window.addEventListener('load', killBadge);
  var mo = new MutationObserver(killBadge);
  mo.observe(document.documentElement, { childList: true, subtree: true });
  setTimeout(function () { try { mo.disconnect(); } catch (e) {} }, 30000);
})();
</script>
</head>
<body>
<nav class="nav">
  <span class="brand">ESP32 Cam</span>
  <a href="index.html">Install</a>
  <a href="wifi_viewer.html">WiFi viewer</a>
  <a href="usb_viewer.html" class="on">USB viewer</a>
</nav>

<div class="page wide">
  <div class="card conn" style="flex-direction:row;flex-wrap:wrap;align-items:flex-end">
    <button id="connect" class="primary">Connect</button>
    <button id="disconnect" disabled>Disconnect</button>
    <label class="field"><span>Baud</span><input id="baud" type="number" value="115200"></label>
    <span class="spacer"></span>
    <span id="status" class="chip">Not connected</span>
  </div>

  <section class="card flush">
    <div class="stage" id="stage"><canvas id="c" width="320" height="240"></canvas></div>
    <div class="toolbar">
      <label class="check">Scale
        <select id="scale">
          <option value="fit">Fit</option>
          <option value="1">1x</option>
          <option value="2">2x</option>
          <option value="3">3x</option>
          <option value="4">4x</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="smooth" checked> Smooth</label>
      <span class="spacer"></span>
      <button id="aiToggle">AI: OFF</button>
      <button id="snap">Snapshot</button>
      <button id="full">Fullscreen</button>
    </div>
  </section>

  <details id="settings" class="card" style="gap:0">
    <summary>Board settings (WiFi stream and USB)</summary>
    <div class="settings-grid">
      <div class="grp">
        <label class="field"><span>Mode</span>
          <select id="s_mode">
            <option value="free">Follow WiFi page</option>
            <option value="jpg">Color JPEG</option>
            <option value="jpgg">Gray JPEG</option>
            <option value="gray">Gray (delta)</option>
            <option value="yuv">Color YUV 4-bit</option>
            <option value="rgb">Color RGB332</option>
            <option value="rgbhq">Color RGB565 (slow)</option>
          </select>
        </label>
        <button id="a_mode" disabled>Apply</button>
      </div>
      <div class="grp">
        <label class="field"><span>WiFi JPEG quality</span>
          <select id="s_q">
            <option value="auto">Auto</option>
            <option value="0">20</option>
            <option value="1">35</option>
            <option value="2">50</option>
            <option value="3">65</option>
          </select>
        </label>
        <button id="a_q" disabled>Apply</button>
      </div>
      <div class="grp">
        <label class="field"><span>USB JPEG quality</span>
          <input id="s_usbq" type="number" min="1" max="100" value="60">
        </label>
        <button id="a_usbq" disabled>Apply</button>
      </div>
    </div>
    <div class="settings-grid" style="margin-top:14px">
      <div class="grp">
        <label class="field"><span>WiFi name</span><input id="s_ssid" type="text" autocomplete="off"></label>
        <label class="field"><span>Password</span><input id="s_pw" type="password" autocomplete="off"></label>
        <button id="a_wifi" disabled>Save and connect</button>
      </div>
      <div class="grp">
        <button id="a_repl" disabled>Exit to REPL</button>
        <button id="a_reboot" disabled>Reboot board</button>
      </div>
    </div>
    <div id="board" style="margin-top:12px">-</div>
  </details>
</div>
<div id="toasts"></div>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  var canvas   = $('c');
  var ctx      = canvas.getContext('2d', { alpha: false });
  var stage    = $('stage');
  var statusEl = $('status');
  var boardEl  = $('board');
  var toastsEl = $('toasts');
  var btnConnect = $('connect'), btnDisconnect = $('disconnect');
  var baudEl = $('baud'), scaleEl = $('scale'), smoothEl = $('smooth');
  var settingBtns = ['a_mode', 'a_q', 'a_usbq', 'a_wifi', 'a_repl', 'a_reboot'];

  var MAX_JPEG = 2 * 1024 * 1024;
  var textEnc = new TextEncoder(), textDec = new TextDecoder();

  var aiModel = null;
  var aiEnabled = false;
  var aiRunning = false;
  var lastDetections = [];

  $('aiToggle').addEventListener('click', async function () {
    aiEnabled = !aiEnabled;
    $('aiToggle').textContent = aiEnabled ? 'AI: ON' : 'AI: OFF';
    if (aiEnabled && !aiModel) {
      toast('AI Model', 'Loading COCO-SSD model...', 'ok');
      try {
        aiModel = await cocoSsd.load();
        toast('AI Model', 'Model loaded successfully', 'ok');
      } catch (e) {
        aiEnabled = false;
        $('aiToggle').textContent = 'AI: OFF';
        toast('AI Model Error', e.message, 'err');
      }
    }
  });

  async function runAI() {
    if (!aiEnabled || !aiModel || aiRunning || canvas.width === 0 || canvas.height === 0) return;
    aiRunning = true;
    try {
      lastDetections = await aiModel.detect(canvas);
    } catch (e) {}
    aiRunning = false;
  }

  function drawDetections() {
    if (!aiEnabled || !lastDetections.length) return;
    ctx.strokeStyle = '#00ffcc';
    ctx.lineWidth = 2;
    ctx.font = '12px sans-serif';
    ctx.fillStyle = '#00ffcc';
    for (var i = 0; i < lastDetections.length; i++) {
      var d = lastDetections[i];
      ctx.strokeRect(d.bbox[0], d.bbox[1], d.bbox[2], d.bbox[3]);
      ctx.fillText(d.class + ' (' + Math.round(d.score * 100) + '%)', d.bbox[0] + 4, d.bbox[1] + 14);
    }
  }

  var lastToastKey = '', lastToastAt = 0;
  function toast(title, msg, kind) {
    msg = String(msg == null ? '' : msg);
    var key = title + '\u0000' + msg, now = Date.now();
    if (key === lastToastKey && now - lastToastAt < 3000) return;
    lastToastKey = key; lastToastAt = now;
    var d = document.createElement('div');
    d.className = 'toast' + (kind ? ' ' + kind : '');
    var t = document.createElement('span');
    t.className = 'tt';
    t.textContent = title;
    d.appendChild(t);
    d.appendChild(document.createTextNode(msg));
    toastsEl.appendChild(d);
    while (toastsEl.children.length > 6) toastsEl.removeChild(toastsEl.firstChild);
    setTimeout(function () {
      d.classList.add('fade');
      setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 350);
    }, kind === 'err' ? 9000 : 5500);
  }

  function applyView() {
    canvas.style.imageRendering = smoothEl.checked ? 'auto' : 'pixelated';
    var cw = canvas.width || 1, ch = canvas.height || 1;
    var s = scaleEl.value;
    if (s === 'fit') {
      var r = stage.getBoundingClientRect();
      var availW = Math.max(32, r.width  - 4);
      var availH = Math.max(32, r.height - 4);
      var k = Math.min(availW / cw, availH / ch);
      canvas.style.width  = Math.max(1, Math.floor(cw * k)) + 'px';
      canvas.style.height = Math.max(1, Math.floor(ch * k)) + 'px';
    } else {
      var k2 = parseInt(s, 10) || 1;
      canvas.style.width  = (cw * k2) + 'px';
      canvas.style.height = (ch * k2) + 'px';
    }
  }
  scaleEl.addEventListener('change', applyView);
  smoothEl.addEventListener('change', applyView);
  window.addEventListener('resize', applyView);
  if (window.ResizeObserver) new ResizeObserver(applyView).observe(stage);
  document.addEventListener('fullscreenchange', function () { setTimeout(applyView, 0); });

  $('full').addEventListener('click', function () { if (canvas.requestFullscreen) canvas.requestFullscreen(); });
  $('snap').addEventListener('click', function () {
    canvas.toBlob(function (b) {
      if (!b) return;
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'esp32-cam-' + Date.now() + '.png';
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    }, 'image/png');
  });

  async function send(obj) {
    if (!writer) return;
    try { await writer.write(textEnc.encode(JSON.stringify(obj) + '\n')); } catch (e) {}
  }
  function enableSettings(on) { settingBtns.forEach(function (id) { $(id).disabled = !on; }); }

  $('a_mode').addEventListener('click', function () { send({ cmd: 'mode', mode: $('s_mode').value }); });
  $('a_q').addEventListener('click', function () {
    var v = $('s_q').value;
    send({ cmd: 'quality', q: v === 'auto' ? 'auto' : parseInt(v, 10) });
  });
  $('a_usbq').addEventListener('click', function () { send({ cmd: 'usbq', q: parseInt($('s_usbq').value, 10) || 60 }); });
  $('a_wifi').addEventListener('click', function () {
    var ssid = $('s_ssid').value.trim();
    if (!ssid) { boardEl.textContent = 'Enter a WiFi name first.'; return; }
    send({ cmd: 'wifi', ssid: ssid, password: $('s_pw').value });
    boardEl.textContent = 'WiFi saved on the board, connecting...';
  });
  $('a_reboot').addEventListener('click', function () { send({ cmd: 'reboot' }); });
  $('a_repl').addEventListener('click', async function () {
    await send({ cmd: 'repl' });
    setTimeout(function () {
      disconnect().then(function () { setStatus('Board is back on the normal REPL (115200 baud).'); });
    }, 300);
  });

  var warnedNoJpeg = false;
  function onMsg(m) {
    if (!m || typeof m !== 'object') return;
    if (m.t === 'status') {
      var wifi = m.wifi
        ? ('WiFi ' + m.ssid + '  http://' + m.ip + '  ' + m.rssi + ' dBm')
        : ('WiFi not connected' + (m.ssid ? ' (' + m.ssid + ')' : ' (no network saved)'));
      boardEl.textContent =
        'Mode: ' + m.mode + (m.locked ? ' (set from USB)' : ' (follows WiFi page)') +
        '  |  WiFi JPEG: ' + (m.q === 'auto' ? 'auto' : 'fixed') + ', now ' + m.qlevel +
        '  |  USB JPEG ' + m.usbq + '  |  ' + wifi + '  |  link ' + m.baud + ' baud' +
        (m.jpeg ? '' : '  |  no jpeg module in this firmware');
      if (document.activeElement !== $('s_ssid') && !$('s_ssid').value && m.ssid) $('s_ssid').value = m.ssid;
      if (!m.jpeg && !warnedNoJpeg) {
        warnedNoJpeg = true;
        toast('No JPEG encoder on the board', 'This firmware has no "jpeg" module, so no frames can be sent over USB.', 'err');
      }
    } else if (m.t === 'error') {
      boardEl.textContent = 'Board error: ' + m.msg;
      toast('Board error', m.msg, 'err');
    }
  }

  var buf  = new Uint8Array(1 << 16), blen = 0;
  var trash = new Uint8Array(8192), trashLen = 0, trashTimer = null;

  var port = null, reader = null, writer = null, running = false, loopDone = null;
  var frames = 0, bytes = 0, tStat = performance.now();
  var seq = 0, shown = 0, gotPacket = false, gotFrame = false, beat = null;
  var decodeFails = 0;
  var lastDataTime = 0, pktCount = 0;
  var seenTexts = Object.create(null);
  var statsSeen = 0;

  function setStatus(t) { statusEl.textContent = t; }

  function append(chunk) {
    if (blen + chunk.length > buf.length) {
      var nb = new Uint8Array(Math.max(buf.length * 2, blen + chunk.length));
      nb.set(buf.subarray(0, blen));
      buf = nb;
    }
    buf.set(chunk, blen);
    blen += chunk.length;
  }
  function consume(n) { if (n <= 0) return; buf.copyWithin(0, n, blen); blen -= n; }

  function addTrash(start, n) {
    if (n <= 0) return;
    if (trashLen + n > trash.length) {
      var keep = Math.min(trashLen, 2048);
      trash.copyWithin(0, trashLen - keep, trashLen);
      trashLen = keep;
      if (trashLen + n > trash.length) n = trash.length - trashLen;
    }
    trash.set(buf.subarray(start, start + n), trashLen);
    trashLen += n;
    if (!trashTimer) trashTimer = setTimeout(function () { trashTimer = null; flushTrash(); }, 400);
  }

  var lastTextToast = 0, textToastStreak = 0, warnedNoise = false;
  var RE_STATS   = /^[A-Za-z0-9_]+:\s*[\d.]+\s*fps\s*\|\s*cap\s*\d+\s*enc\s*\d+\s*send\s*\d+\s*ms\s*\|\s*\d+\s*B\/frame\s*\|\s*level\s+[\w.]+\s*\|\s*rssi\s*-?\d+\s*dBm\s*$/;
  var RE_BOOT    = /^(USB:|WiFi:|Camera init:|Frame:|Switching mode|Now:|Adopting real frame:|Stopped|Board )/;

  function flushTrash() {
    if (!trashLen) return;
    var n = trashLen;
    trashLen = 0;
    var printable = 0, s = '';
    for (var i = 0; i < n; i++) {
      var b = trash[i];
      if (b === 9 || b === 10 || b === 13 || b === 32) { printable++; s += ' '; }
      else if (b >= 33 && b < 127) { printable++; s += String.fromCharCode(b); }
      else { s += '\u00b7'; }
    }
    if (printable < 4 || printable < n * 0.85) return;
    var txt = s.replace(/\s+/g, ' ').trim();
    if (!txt || !/[A-Za-z0-9]/.test(txt)) return;

    if (RE_STATS.test(txt)) {
      statsSeen++;
      if (statsSeen === 3) {
        toast('USB streaming not engaged', 'The board is printing its WiFi stats line to the serial console.', 'err');
      }
      return;
    }

    var dots = 0, alnum = 0, vowels = 0;
    for (var k = 0; k < txt.length; k++) {
      var c = txt.charAt(k);
      if (c === '\u00b7') dots++;
      if (/[A-Za-z0-9]/.test(c)) { alnum++; if (/[aeiouAEIOU]/.test(c)) vowels++; }
    }
    var garbled = (dots > txt.length * 0.10) || (txt.length >= 8 && alnum < txt.length * 0.35) || (alnum >= 12 && vowels === 0);
    if (garbled) {
      if (!warnedNoise) {
        warnedNoise = true;
        toast('Ignoring garbled UART data', 'The board appears to be sending data at a different baud rate.', 'text');
      }
      return;
    }

    if (seenTexts[txt]) return;
    seenTexts[txt] = true;
    if (RE_BOOT.test(txt)) { toast('Board', txt, 'text'); return; }

    var now = Date.now();
    if (now - lastTextToast < 1500) textToastStreak++; else textToastStreak = 0;
    lastTextToast = now;
    if (textToastStreak > 3) return;
    toast('Board sent text (not an image)', txt, 'text');
  }

  function dropOne() { addTrash(0, 1); consume(1); }

  function waitedTooLong() {
    if (!lastDataTime) return false;
    if (performance.now() - lastDataTime > 6000) { lastDataTime = performance.now(); return true; }
    return false;
  }

  function showJpeg(data) {
    var my = ++seq;
    createImageBitmap(new Blob([data], { type: 'image/jpeg' })).then(function (bmp) {
      if (my > shown) {
        shown = my;
        if (bmp.width !== canvas.width || bmp.height !== canvas.height) {
          canvas.width  = bmp.width;
          canvas.height = bmp.height;
          applyView();
        }
        ctx.drawImage(bmp, 0, 0);
        drawDetections();
        frames++;
        gotFrame = true;
        if (aiEnabled && aiModel) {
          runAI();
        }
      }
      bmp.close();
    }, function (err) {
      decodeFails++;
      if (decodeFails === 1 || decodeFails % 120 === 0) {
        toast('JPEG decode failed', (err && err.message ? err.message : String(err)) + '  (' + decodeFails + ' frames)', 'err');
      }
    });
  }

  function parse() {
    for (;;) {
      var found = -1;
      for (var i = 0; i + 4 <= blen; i++) {
        if (buf[i] === 0xA5 && buf[i + 1] === 0x5A && buf[i + 2] === 0xC3 &&
            (buf[i + 3] === 0x3C || buf[i + 3] === 0x3D)) { found = i; break; }
      }
      if (found < 0) {
        var keep = 3;
        if (blen > keep) { addTrash(0, blen - keep); consume(blen - keep); }
        return;
      }
      if (found > 0) { addTrash(0, found); consume(found); }
      if (blen < 8) return;
      var kind = buf[3];
      var len  = (buf[4] | (buf[5] << 8) | (buf[6] << 16)) + buf[7] * 16777216;
      if (!(len >= 0)) { dropOne(); continue; }

      if (kind === 0x3D) {
        if (len < 2 || len > 8192) { dropOne(); continue; }
        if (blen < 8 + len) { if (waitedTooLong()) { dropOne(); continue; } return; }
        var txt = textDec.decode(buf.subarray(8, 8 + len));
        gotPacket = true; pktCount++;
        try { onMsg(JSON.parse(txt)); } catch (e) { toast('Board message', txt, 'text'); }
        consume(8 + len);
        continue;
      }

      if (len < 4 || len > MAX_JPEG) { dropOne(); continue; }
      if (blen < 10) return;
      if (buf[8] !== 0xFF || buf[9] !== 0xD8) { dropOne(); continue; }
      if (blen < 8 + len) { if (waitedTooLong()) { dropOne(); continue; } return; }
      if (buf[8 + len - 2] !== 0xFF || buf[8 + len - 1] !== 0xD9) { dropOne(); continue; }
      gotPacket = true; pktCount++;
      showJpeg(buf.slice(8, 8 + len));
      consume(8 + len);
    }
  }

  async function readLoop() {
    while (running && port && port.readable) {
      reader = port.readable.getReader();
      try {
        for (;;) {
          var r = await reader.read();
          if (r.done) break;
          if (r.value && r.value.length) {
            bytes += r.value.length;
            lastDataTime = performance.now();
            append(r.value);
            parse();
          }
        }
      } catch (e) { setStatus('Read error: ' + e.message); }
      finally { try { reader.releaseLock(); } catch (e2) {} reader = null; }
    }
  }

  async function connect() {
    if (!('serial' in navigator)) {
      setStatus('Web Serial is not available: use Chrome or Edge on a PC.');
      toast('Web Serial unavailable', 'Use Chrome or Edge on a desktop PC.', 'err');
      return;
    }
    try {
      port = await navigator.serial.requestPort();
      await port.open({ baudRate: parseInt(baudEl.value, 10) || 115200, bufferSize: 1 << 18 });
      try { await port.setSignals({ dataTerminalReady: false, requestToSend: false }); } catch (e) {}
      writer = port.writable.getWriter();
    } catch (e) {
      setStatus('Could not open the port: ' + e.message);
      port = null;
      return;
    }

    blen = 0; trashLen = 0; lastDataTime = 0;
    frames = 0; bytes = 0; tStat = performance.now();
    gotPacket = false; gotFrame = false; decodeFails = 0;
    pktCount = 0; seenTexts = Object.create(null);
    warnedNoise = false; warnedNoJpeg = false;
    statsSeen = 0; seq = 0; shown = 0;
    running = true;
    btnConnect.disabled = true;
    btnDisconnect.disabled = false;
    enableSettings(true);
    setStatus('Connected, waiting for the board...');
    toast('Connected', 'Waiting for the board to start streaming...', 'ok');

    (function retryUsb() {
      if (!running) return;
      send({ cmd: 'usb', on: true });
    })();
    var tries = [400, 1000, 2000, 4000];
    tries.forEach(function (ms) {
      setTimeout(function () { if (running) send({ cmd: 'usb', on: true }); }, ms);
    });
    setTimeout(function () { if (running) send({ cmd: 'get' }); }, 600);
    beat = setInterval(function () { if (running) send({ cmd: 'get' }); }, 2000);

    setTimeout(function () {
      if (running && !gotPacket) {
        setStatus('No data yet. Wait ~5 s after the board boots.');
      }
    }, 5000);

    loopDone = readLoop();
    await loopDone;
    if (running) { await disconnect(); setStatus('Port closed'); }
  }

  async function disconnect() {
    var wasRunning = running;
    running = false;
    if (beat) { clearInterval(beat); beat = null; }
    if (wasRunning && writer) {
      try { await writer.write(textEnc.encode(JSON.stringify({ cmd: 'usb', on: false }) + '\n')); } catch (e) {}
    }
    try { if (reader) await reader.cancel(); } catch (e) {}
    try { if (loopDone) await loopDone; } catch (e) {}
    try { if (writer) writer.releaseLock(); } catch (e) {}
    writer = null;
    try { if (port) await port.close(); } catch (e) {}
    port = null;
    btnConnect.disabled = false;
    btnDisconnect.disabled = true;
    enableSettings(false);
    setStatus('Disconnected');
  }

  btnConnect.addEventListener('click', connect);
  btnDisconnect.addEventListener('click', disconnect);
  if ('serial' in navigator) {
    navigator.serial.addEventListener('disconnect', function () {
      if (running) disconnect().then(function () { setStatus('Device unplugged'); });
    });
  }

  setInterval(function () {
    if (!running) return;
    var now = performance.now();
    var dt = (now - tStat) / 1000;
    if (dt <= 0) return;
    if (gotFrame) {
      setStatus(canvas.width + 'x' + canvas.height + '  ' + (frames / dt).toFixed(1) + ' fps  ' + (bytes / 1024 / dt).toFixed(0) + ' KB/s');
    } else if (bytes > 0) {
      var kb = (bytes / 1024 / dt).toFixed(0);
      var extra = pktCount > 0 ? '  (' + pktCount + ' packets, no frames)' : '  (no valid packets yet)';
      setStatus('Receiving data at ' + kb + ' KB/s' + extra);
    }
    frames = 0; bytes = 0; tStat = now;
  }, 1000);

  applyView();
})();
</script>
</body>
</html>
