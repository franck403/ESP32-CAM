<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 WiFi Viewer</title>
<link rel="stylesheet" href="ui.css">
<style>
  .grid2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:16px;align-items:start}
  @media (max-width:920px){.grid2{grid-template-columns:1fr}}
  .vbtn.on{border-color:var(--accent);background:rgba(59,130,246,.14)}
  #viewbar{flex-wrap:wrap}
  .conn{flex-direction:row;align-items:flex-end;flex-wrap:wrap;gap:10px}
  .conn .chip{align-self:center}
  #status{font-size:13px}
  #net{padding:0 12px 10px;min-height:0}
</style>
</head>
<body>
<nav class="nav">
  <span class="brand">ESP32 Cam</span>
  <a href="index.html">Install</a>
  <a href="wifi_viewer.html" class="on">WiFi viewer</a>
  <a href="usb_viewer.html">USB viewer</a>
</nav>

<div class="page wide">
  <div id="warn" class="notice" hidden></div>

  <div class="card conn">
    <label class="field grow"><span>Board IP</span>
      <input type="text" id="ip" list="recent" placeholder="192.168.x.x" autocomplete="off" spellcheck="false"></label>
    <datalist id="recent"></datalist>
    <button id="connect" class="primary">Connect</button>
    <button id="disconnect" disabled>Disconnect</button>
    <span id="chip" class="chip"><i class="dot"></i><span id="chipText">Not connected</span></span>
  </div>

  <div class="grid2">
    <!-- ============ stream ============ -->
    <section class="card flush">
      <div class="stage" id="stage"><canvas id="c" width="320" height="240"></canvas></div>
      <div class="toolbar">
        <span id="status" class="muted">Not connected</span>
        <span class="spacer"></span>
        <select id="fmt" title="Stream mode">
          <option value="jpg">Color</option>
          <option value="jpgg">Gray</option>
        </select>
        <select id="scale" title="Scale">
          <option value="fit">Fit</option>
          <option value="1">1x</option>
          <option value="2">2x</option>
          <option value="3">3x</option>
          <option value="4">4x</option>
        </select>
        <label class="check"><input type="checkbox" id="smooth" checked> Smooth</label>
        <button id="snap">Snapshot</button>
        <button id="full">Fullscreen</button>
      </div>
      <div class="toolbar" id="viewbar">
        <button id="rotL" class="vbtn" title="Rotate 90&deg; left (counter-clockwise)">&#8634; Rotate L</button>
        <button id="rotR" class="vbtn" title="Rotate 90&deg; right (clockwise)">&#8635; Rotate R</button>
        <span id="rotLbl" class="muted small" style="min-width:34px;text-align:center">0&deg;</span>
        <button id="flipH" class="vbtn" title="Mirror left/right">&#8596; Flip H</button>
        <button id="flipV" class="vbtn" title="Mirror up/down">&#8597; Flip V</button>
        <label class="check small" title="Brightness">Bright <input type="range" id="br" min="50" max="200" value="100" style="width:80px"></label>
        <label class="check small" title="Contrast">Contrast <input type="range" id="ct" min="50" max="200" value="100" style="width:80px"></label>
        <span class="spacer"></span>
        <button id="pause" class="vbtn" title="Freeze the picture (the stream keeps running)">Pause</button>
        <button id="viewReset" title="Reset rotation, flips, brightness and contrast">Reset view</button>
      </div>
      <div id="net" class="muted small"></div>
    </section>

    <!-- ============ AI (shared panel, see ai.js) ============ -->
    <section class="card" id="aiMount"></section>
  </div>
</div>

<script src="ai.js"></script>
<script type="module">
'use strict';
const $ = (id) => document.getElementById(id);

/* ==================== storage (saved IP, recent IPs) ==================== */
const LS_IP = 'esp32cam.ip', LS_RECENT = 'esp32cam.recent';
const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
function getRecent() {
  try { const a = JSON.parse(lsGet(LS_RECENT) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; }
}
function fillRecent() {
  const dl = $('recent');
  dl.textContent = '';
  getRecent().forEach((h) => { const o = document.createElement('option'); o.value = h; dl.appendChild(o); });
}
function rememberIp(h) {
  lsSet(LS_IP, h);
  const a = getRecent().filter((x) => x !== h);
  a.unshift(h);
  lsSet(LS_RECENT, JSON.stringify(a.slice(0, 6)));
  fillRecent();
}
function cleanHost(s) {
  return String(s || '').trim().replace(/^https?:\/\//i, '').replace(/[\/?#].*$/, '');
}

/* ==================== view ==================== */
const canvas = $('c'), ctx = canvas.getContext('2d', { alpha: false });
const stage = $('stage'), statusEl = $('status'), scaleEl = $('scale'), smoothEl = $('smooth');

function setChip(kind, text) {
  $('chip').className = 'chip' + (kind ? ' ' + kind : '');
  $('chipText').textContent = text;
}

function applyView() {
  canvas.style.imageRendering = smoothEl.checked ? 'auto' : 'pixelated';
  const cw = canvas.width || 1, ch = canvas.height || 1, s = scaleEl.value;
  if (s === 'fit') {
    const r = stage.getBoundingClientRect();
    const k = Math.min(Math.max(32, r.width - 4) / cw, Math.max(32, r.height - 4) / ch);
    canvas.style.width = Math.max(1, Math.floor(cw * k)) + 'px';
    canvas.style.height = Math.max(1, Math.floor(ch * k)) + 'px';
  } else {
    const k2 = parseInt(s, 10) || 1;
    canvas.style.width = (cw * k2) + 'px';
    canvas.style.height = (ch * k2) + 'px';
  }
}
scaleEl.addEventListener('change', applyView);
smoothEl.addEventListener('change', applyView);
window.addEventListener('resize', applyView);
if (window.ResizeObserver) new ResizeObserver(applyView).observe(stage);
document.addEventListener('fullscreenchange', () => setTimeout(applyView, 0));
$('full').addEventListener('click', () => { if (canvas.requestFullscreen) canvas.requestFullscreen(); });
$('snap').addEventListener('click', () => {
  canvas.toBlob((b) => {
    if (!b) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'esp32-cam-' + Date.now() + '.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }, 'image/png');
});

/* ==================== view transform: rotate / flip / brightness / contrast ==================== */
// The board always sends the raw frame. It is kept in `src` and painted to the visible canvas
// with the transform applied, so changing the view re-paints instantly (no new frame needed),
// and Snapshot / AI analysis get the picture exactly as you see it (upright).
const LS_VIEW = 'esp32cam.view';
const view = { rot: 0, fx: false, fy: false, br: 100, ct: 100 };
try { Object.assign(view, JSON.parse(lsGet(LS_VIEW) || '{}')); } catch (e) {}
view.rot = (((Math.round((parseInt(view.rot, 10) || 0) / 90) * 90) % 360) + 360) % 360;
view.fx = !!view.fx; view.fy = !!view.fy;
view.br = Math.max(50, Math.min(200, parseInt(view.br, 10) || 100));
view.ct = Math.max(50, Math.min(200, parseInt(view.ct, 10) || 100));

const src = document.createElement('canvas');            // untouched frame from the board
const sctx = src.getContext('2d', { alpha: false });
let paused = false;

function paint() {
  if (!src.width || !src.height) return;
  const odd = view.rot === 90 || view.rot === 270;
  const cw = odd ? src.height : src.width, ch = odd ? src.width : src.height;
  if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; applyView(); }
  ctx.save();
  ctx.filter = (view.br !== 100 || view.ct !== 100) ? 'brightness(' + view.br + '%) contrast(' + view.ct + '%)' : 'none';
  ctx.translate(cw / 2, ch / 2);
  ctx.scale(view.fx ? -1 : 1, view.fy ? -1 : 1);          // flips act on the screen, after the rotation
  ctx.rotate(view.rot * Math.PI / 180);
  ctx.drawImage(src, -src.width / 2, -src.height / 2);
  ctx.restore();
}

function viewChanged() {
  $('flipH').classList.toggle('on', view.fx);
  $('flipV').classList.toggle('on', view.fy);
  $('pause').classList.toggle('on', paused);
  $('pause').textContent = paused ? 'Resume' : 'Pause';
  $('rotLbl').textContent = view.rot + '°';
  $('br').value = view.br;
  $('ct').value = view.ct;
  lsSet(LS_VIEW, JSON.stringify(view));
  paint();
}
$('rotL').addEventListener('click', () => { view.rot = (view.rot + 270) % 360; viewChanged(); });
$('rotR').addEventListener('click', () => { view.rot = (view.rot + 90) % 360; viewChanged(); });
$('flipH').addEventListener('click', () => { view.fx = !view.fx; viewChanged(); });
$('flipV').addEventListener('click', () => { view.fy = !view.fy; viewChanged(); });
$('br').addEventListener('input', () => { view.br = parseInt($('br').value, 10) || 100; viewChanged(); });
$('ct').addEventListener('input', () => { view.ct = parseInt($('ct').value, 10) || 100; viewChanged(); });
$('pause').addEventListener('click', () => { paused = !paused; viewChanged(); });
$('viewReset').addEventListener('click', () => {
  view.rot = 0; view.fx = false; view.fy = false; view.br = 100; view.ct = 100; paused = false;
  viewChanged();
});
viewChanged();

/* ==================== HTTPS warning ==================== */
function updateWarn() {
  const w = $('warn');
  if (location.protocol !== 'https:') { w.hidden = true; return; }
  w.hidden = false;
  w.textContent = 'The browser will ask the site to use local devices. Click Allow.';
}
$('ip').addEventListener('input', updateWarn);

/* ==================== AI panel (every X seconds / every X frames) ==================== */
let gotFrame = false;
const ai = window.CamAI
  ? window.CamAI.mount($('aiMount'), { getCanvas: () => canvas, ready: () => gotFrame })
  : null;
if (!ai) $('aiMount').textContent = 'ai.js could not be loaded: keep it next to this page.';

/* ==================== stream parser (JPEG packets) ==================== */
// Board stream: 5 bytes geometry (W W H H FMT), then packets: type u8 + len u32 LE + payload. Type 3 = JPEG.
let W = 0, H = 0, FMT = 0, state = 0, geomFill = 0, headFill = 0;
let payloadType = 0, payloadLen = 0, payloadFill = 0, payloadBuf = null;
let sharedPayload = new Uint8Array(1 << 16);
const geomBuf = new Uint8Array(5), headBuf = new Uint8Array(5);
let frames = 0, bytesIn = 0, fpsT = performance.now(), lastData = performance.now();
let nonJpeg = false, fails = 0, jpgSeq = 0, jpgShown = 0;
let running = false, host = '', gen = 0, ctl = null;

function resetParser() { state = 0; geomFill = 0; headFill = 0; payloadFill = 0; }

function drawJpeg(payload) {
  const my = ++jpgSeq;
  const blob = new Blob([payload.slice()], { type: 'image/jpeg' });   // slice() copies: buffer is reused
  createImageBitmap(blob).then((bmp) => {
    if (my > jpgShown) {
      jpgShown = my;
      if (!paused) {
        if (src.width !== bmp.width || src.height !== bmp.height) { src.width = bmp.width; src.height = bmp.height; }
        sctx.drawImage(bmp, 0, 0);
        paint();
      }
      frames++;
      if (!gotFrame) {
        gotFrame = true;
        rememberIp(host);               // reached the board: keep this IP for next time
        setChip('live', 'Live');
      }
      if (ai) ai.frame();               // drives "every X frames"
    }
    bmp.close();
  }).catch(() => {});
}

function feed(chunk) {
  bytesIn += chunk.length;
  lastData = performance.now();
  fails = 0;
  let off = 0;
  while (off < chunk.length) {
    if (state === 0) {
      const n = Math.min(5 - geomFill, chunk.length - off);
      geomBuf.set(chunk.subarray(off, off + n), geomFill);
      geomFill += n; off += n;
      if (geomFill === 5) {
        W = geomBuf[0] | (geomBuf[1] << 8);
        H = geomBuf[2] | (geomBuf[3] << 8);
        FMT = geomBuf[4];
        nonJpeg = FMT !== 5;
        if (W && H && (src.width !== W || src.height !== H)) { src.width = W; src.height = H; paint(); }
        state = 1;
      }
    } else if (state === 1) {
      const n = Math.min(5 - headFill, chunk.length - off);
      headBuf.set(chunk.subarray(off, off + n), headFill);
      headFill += n; off += n;
      if (headFill === 5) {
        payloadType = headBuf[0];
        payloadLen = (headBuf[1] | (headBuf[2] << 8) | (headBuf[3] << 16)) + headBuf[4] * 16777216;
        if (payloadLen > 0x4000000) throw new Error('corrupt stream');
        if (payloadLen > sharedPayload.length) sharedPayload = new Uint8Array(Math.max(payloadLen, sharedPayload.length * 2));
        payloadBuf = sharedPayload.subarray(0, payloadLen);
        payloadFill = 0;
        state = 2;
      }
    } else {
      const n = Math.min(payloadLen - payloadFill, chunk.length - off);
      payloadBuf.set(chunk.subarray(off, off + n), payloadFill);
      payloadFill += n; off += n;
      if (payloadFill === payloadLen) {
        if (payloadType === 3) drawJpeg(payloadBuf); else nonJpeg = true;
        state = 1;
        headFill = 0;
      }
    }
  }
}

/* ==================== connection ==================== */
function run() {
  const my = ++gen;
  if (ctl) { try { ctl.abort(); } catch (e) {} }
  ctl = new AbortController();
  resetParser();
  lastData = performance.now();
  fetch('http://' + host + '/stream?fmt=' + $('fmt').value, { cache: 'no-store', signal: ctl.signal })
    .then((res) => {
      if (!res.ok || !res.body) throw new Error('bad response');
      const rd = res.body.getReader();
      return (function pump() {
        return rd.read().then((r) => {
          if (my !== gen || r.done) return;
          feed(r.value);
          return pump();
        });
      })();
    })
    .catch(() => { if (my === gen) fails++; })
    .then(() => {
      if (my !== gen || !running) return;
      setTimeout(() => { if (my === gen && running) run(); }, 800);
    });
}

function connect() {
  host = cleanHost($('ip').value);
  if (!host) { statusEl.textContent = 'Enter the board IP.'; setChip('err', 'No IP'); return; }
  $('ip').value = host;
  running = true;
  gotFrame = false; nonJpeg = false; fails = 0;
  $('connect').disabled = true;
  $('disconnect').disabled = false;
  updateWarn();
  setChip('wait', 'Connecting...');
  statusEl.textContent = 'Connecting to ' + host + '...';
  run();
  pollNet();
}

function disconnect() {
  running = false;
  gen++;
  if (ctl) { try { ctl.abort(); } catch (e) {} }
  $('connect').disabled = false;
  $('disconnect').disabled = true;
  $('net').textContent = '';
  setChip('', 'Not connected');
  statusEl.textContent = 'Disconnected';
}

$('connect').addEventListener('click', connect);
$('disconnect').addEventListener('click', disconnect);
$('ip').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !running) connect(); });
$('fmt').addEventListener('change', () => { if (running) run(); });

function pollNet() {
  if (!running) return;
  fetch('http://' + host + '/net', { cache: 'no-store' })
    .then((r) => r.json())
    .then((d) => {
      const p = [];
      if (d.sta_up) p.push('WiFi ' + d.sta_ssid + ' ' + d.sta_ip + ' (' + d.rssi + ' dBm)');
      else if (d.sta_ssid && d.sta_state) p.push('WiFi ' + d.sta_ssid + ': ' + d.sta_state);
      if (d.ap_up) p.push('Hotspot ' + d.ap_ssid + ' ' + d.ap_ip + (d.ap_clients ? ' (' + d.ap_clients + ' connected)' : ''));
      $('net').textContent = p.join('  |  ');
    })
    .catch(() => {});
  setTimeout(pollNet, 5000);
}

setInterval(() => {
  if (!running) return;
  const now = performance.now();
  if (now - fpsT >= 1000) {
    const fps = frames * 1000 / (now - fpsT), kbps = bytesIn * 8 / (now - fpsT);
    frames = 0; bytesIn = 0; fpsT = now;
    if (nonJpeg) {
      setChip('err', 'Wrong mode');
      statusEl.textContent = 'The board is not sending JPEG (mode locked from the USB viewer). ' +
        'In the USB viewer pick Mode "Follow WiFi page" or a JPEG mode, then reconnect.';
    } else if (gotFrame) {
      statusEl.textContent = W + 'x' + H + '  ' + fps.toFixed(1) + ' fps  ' + kbps.toFixed(0) + ' kbps';
    } else if (fails >= 2) {
      setChip('err', 'Unreachable');
      statusEl.textContent = 'Cannot reach http://' + host + '/ . Check the IP, that you are on the same network ' +
        '(or the ESP32-CAM hotspot), and allow local device access when the browser asks.';
    }
  }
  if (now - lastData > 5000) { lastData = now; run(); }     // stalled stream: restart
}, 1000);

/* ==================== start: use ?ip= or the saved IP ==================== */
fillRecent();
const q = new URLSearchParams(location.search).get('ip');
const startIp = cleanHost(q || lsGet(LS_IP) || '');
if (startIp) $('ip').value = startIp;
applyView();
updateWarn();
if (startIp) connect();      // saved IP: connect right away
</script>
</body>
</html>
